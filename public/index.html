    <!--
      Set the theme before first paint so the page never flashes the wrong
      colours. Kept inline and dependency-free on purpose; the React theme hook
      reads the same value afterwards.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mj-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
